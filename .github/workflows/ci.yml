name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats

      - name: ShellCheck
        run: shellcheck firewall.sh tests/fake-bin/*

      - name: Tests
        run: bats tests/
